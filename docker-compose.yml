services:
  app:
    build:
      context: .
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/database/soli-isle.sqlite
      RESOURCE_DIR: /data/images
      AUTHOR_PASSWORD_HASH: ${AUTHOR_PASSWORD_HASH:-}
    volumes:
      - ./data/database:/data/database
      - ./data/images:/data/images
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
